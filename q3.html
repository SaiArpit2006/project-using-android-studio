 <!DOCTYPE html>
<html lang="en">
<head>
  <title>lab 6 q3</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .toolbar {
      background-color: #111;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toolbar button {
      margin-left: 10px;
      padding: 5px 10px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    .toolbar button:hover {
      background-color: #555;
    }

    .header {
      background-color: #f95d6a;
      color: white;
      padding: 30px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 28px;
    }

    .tagline {
      font-style: italic;
      font-size: 14px;
    }

    .nav {
      background-color: yellow;
      display: flex;
      justify-content: center;
      padding: 10px 0;
    }

    .nav a {
      margin: 0 15px;
      text-decoration: none;
      color: black;
      font-weight: bold;
    }

    .nav a:hover {
      text-decoration: underline;
    }

    .content {
      background-color: #cceeff;
      padding: 50px 20px;
      text-align: center;
    }

    .content h2 {
      color: #222;
      font-size: 24px;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <div>Flexbox grid layout w/ Mobile Menu<br>
    
    <small>A PEN BY Lindsey</small>
    </div>
    <div>
      <button>Fork</button>
      <button>Change View</button>
      <button>Log In</button>
      <button>Sign Up</button>
    </div>
  </div>

  <div class="header">
    <h1>Super Cool Website!</h1>
    <div class="tagline">Because flexbox is super cool!</div>
  </div>

  <div class="nav">
    <a href="#">ABOUT</a>
    <a href="#">WORK</a>
    <a href="#">METHODS</a>
    <a href="#">RESULTS</a>
    <a href="#">CONTACT</a>
  </div>

  <div class="content">
    <h2>This is the super cool section title</h2>
  </div>

</body>
</html>
