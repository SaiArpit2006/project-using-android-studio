<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Blog</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f4f4;
    }

    header, footer {
      background-color: #333;
      color: white;
      padding: 1em;
      text-align: left;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
    }

    .container {
      display: flex;
      padding: 20px;
    }

    .main-content {
      flex: 3;
      padding-right: 20px;
    }

    .sidebar {
      flex: 1;
      background-color: #ddd;
      padding: 10px;
    }

    .post-title {
      background-color: #fff;
      border: 2px solid #ccc;
      padding: 10px;
      margin-bottom: 15px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
      font-size: 24px;
      font-weight: none;
    }

    .post-image {
      max-width: 100%;
      height: auto;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>My Blog</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <div class="container">
    <div class="main-content">
      <div class="post-title"><h4>Blog Post Title</h4>
      <img src="N:\UIUX LAB\LAB 7\Screenshot 2025-09-29 101238.png" alt="Cartoon Panda Sticker" class="post-image">
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer nec odio.</p>
    </div></div>
    <div class="sidebar">
      <h3>Sidebar</h3>
      <p>Links and other information.</p>
    </div>
  </div>

  <footer>
    <p style="text-align:center">© 2024 My Blog. Follow us on social media!</p>
  </footer>

</body>
</html>
