<!DOCTYPE html>

<title>lab6 q1</title>
<style>
body{
margin: 0;
font-family: Arial, sans-serif;
}
.header {
background-color: black;
color: white;
height: 50px;
display: flex;
align-items: center;
justify-content: space-between;
padding: 0 20px;
}
.header h1 {
font-size: 16px;
margin: 0;
}
.header .menu {
 display: flex;
 gap: 15px;
}
.header .menu a {
color: white;
text-decoration: none;
font-size: 14px;
}
.header .menu a:hover {
text-decoration: underline;
}
.sidebar{
width: 160px;
height: calc(100vh);
background-color: #333;
color: white;
float: left;
padding: 20px;
}
.sidebar h2 {
font-size: 18px;
margin-bottom: 20px;
}
.sidebar a {
display: block;
color: white;
text-decoration: none;
margin: 10px 0;
font-weight: bold;
}
.sidebar a:hover {
text-decoration: underline;
}
.main {
margin-left: 200px;
background-color: #5ccfe6;
min-height: calc(100vh - 100px); /* full height minus header and bottom bar */
padding: 50px;
}
.main h1 {
text-align: center;
color: white;
}
.main p {
max-width: 600px;
margin: auto;
text-align: center;
color: white;
font-size: 14px;
}
.bottom {
height: 50px;
background-color: #ffcc00;
margin-left: 200px;
}
</style>
</head>
